<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">AI data workflow visual</title>
  <desc id="desc">An abstract composition of code, charts, data nodes, and machine learning workflow cards.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2f80ed"/>
      <stop offset="1" stop-color="#71c7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1d3557" flood-opacity=".15"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#2f80ed" opacity=".16"/>
    </pattern>
  </defs>
  <rect width="900" height="900" rx="26" fill="url(#paper)"/>
  <rect width="900" height="900" fill="url(#dots)"/>
  <path d="M124 607 C238 484 309 735 438 590 S643 333 775 454" fill="none" stroke="#2f80ed" stroke-width="8" stroke-linecap="round" opacity=".75"/>
  <path d="M120 612 C258 596 326 641 443 586 C560 531 609 425 776 451" fill="none" stroke="#111318" stroke-width="2" stroke-dasharray="10 13" opacity=".35"/>
  <g filter="url(#shadow)">
    <rect x="85" y="95" width="340" height="250" rx="18" fill="#fff"/>
    <rect x="85" y="95" width="340" height="58" rx="18" fill="#111318"/>
    <circle cx="121" cy="124" r="7" fill="#ff6b6b"/>
    <circle cx="145" cy="124" r="7" fill="#ffd166"/>
    <circle cx="169" cy="124" r="7" fill="#06d6a0"/>
    <text x="116" y="194" fill="#2f80ed" font-family="Consolas, monospace" font-size="28" font-weight="700">def insight(data):</text>
    <text x="132" y="242" fill="#545b67" font-family="Consolas, monospace" font-size="24">clean = pandas(data)</text>
    <text x="132" y="288" fill="#545b67" font-family="Consolas, monospace" font-size="24">return model.predict(clean)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="503" y="116" width="305" height="305" rx="20" fill="#fff"/>
    <text x="543" y="174" fill="#111318" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800">Model Score</text>
    <text x="543" y="228" fill="#2f80ed" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="900">94%</text>
    <rect x="543" y="275" width="205" height="18" rx="9" fill="#dcecff"/>
    <rect x="543" y="275" width="168" height="18" rx="9" fill="url(#blue)"/>
    <rect x="543" y="335" width="44" height="38" rx="6" fill="#2f80ed" opacity=".28"/>
    <rect x="603" y="309" width="44" height="64" rx="6" fill="#2f80ed" opacity=".48"/>
    <rect x="663" y="255" width="44" height="118" rx="6" fill="#2f80ed" opacity=".78"/>
    <rect x="723" y="286" width="44" height="87" rx="6" fill="#111318" opacity=".82"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="151" y="498" width="277" height="270" rx="20" fill="#fff"/>
    <text x="191" y="560" fill="#111318" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Data Pipeline</text>
    <circle cx="219" cy="630" r="34" fill="#dcecff" stroke="#2f80ed" stroke-width="4"/>
    <circle cx="312" cy="630" r="34" fill="#dcecff" stroke="#2f80ed" stroke-width="4"/>
    <circle cx="359" cy="704" r="34" fill="#111318" opacity=".88"/>
    <path d="M253 630h25M329 659l17 27M285 657l48 34" stroke="#2f80ed" stroke-width="6" stroke-linecap="round"/>
    <text x="191" y="724" fill="#5f89a8" font-family="Consolas, monospace" font-size="22" font-weight="700">SQL · Python · ML</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="487" y="558" width="296" height="186" rx="20" fill="#111318"/>
    <text x="526" y="615" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800">AI Assistant</text>
    <text x="526" y="663" fill="#b9c7d8" font-family="Inter, Arial, sans-serif" font-size="24">Retrieve → Reason → Reply</text>
    <rect x="526" y="694" width="202" height="18" rx="9" fill="#2f80ed"/>
  </g>
  <circle cx="124" cy="607" r="18" fill="#2f80ed"/>
  <circle cx="438" cy="590" r="18" fill="#2f80ed"/>
  <circle cx="775" cy="454" r="18" fill="#2f80ed"/>
</svg>
